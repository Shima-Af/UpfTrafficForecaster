stages:

  build_graph:
    cmd: python -m src.aggregate
    deps:
      - src/aggregate.py
      - data/netmob/raw/Lyon/Lyon.geojson
      - data/netmob/raw/Lyon/Lyon_Sites_Cartoradio.csv
    params:
      - params.yaml:
          - grid
          - aggregation
    outs:
      - data/graphs/voronoi_map.parquet
      - data/graphs/bs_locations.parquet
      - data/graphs/graph_edges.parquet
      - data/graphs/node_index.parquet
      - data/graphs/edge_index.npy
      - data/graphs/edge_attr.npy

  preprocess:
    cmd: python -m src.preprocess data/netmob/raw data/netmob/processed data/graphs
    deps:
      - src/preprocess.py
      - src/netmob_loader.py
      - data/netmob/raw
      - data/graphs/voronoi_map.parquet
    params:
      - params.yaml:
          - netmob
          - preprocess
    outs:
      - data/netmob/processed

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/cluster.py
      - src/coarsen.py
      - src/cluster_dataset.py
      - src/model.py
      - src/dataset.py
      - data/netmob/processed
      - data/graphs/bs_locations.parquet
      - data/graphs/node_index.parquet
      - data/graphs/edge_index.npy
      - data/graphs/edge_attr.npy
    params:
      - config.yaml:
          - data
          - clustering
          - coarsening
          - stgnn
          - training
    outs:
      - data/cluster_first
      - checkpoints/cluster_first
    metrics:
      - results/cluster_first/total/sweep_results.json:
          cache: false

  evaluate_forecast:
    cmd: python -m src.evaluate_forecast
    deps:
      - src/evaluate_forecast.py
      - src/cluster_dataset.py
      - src/model.py
      - config.yaml
      - data/cluster_first
      - checkpoints/cluster_first
      - data/graphs/bs_locations.parquet
      - data/graphs/edge_index.npy
      - data/graphs/node_index.parquet
    params:
      - config.yaml:
          - data
          - stgnn
          - training
    outs:
      - results/cluster_first/Netflix
    metrics:
      - results/cluster_first/total/forecast_eval_summary.json:
          cache: false

stages:

  build_graph:
    cmd: python -m src.aggregate
    deps:
      - src/aggregate.py
      - data/netmob/raw/Lyon/Lyon.geojson
      - data/netmob/raw/Lyon/Lyon_Sites_Cartoradio.csv
    params:
      - params.yaml:
          - grid
          - aggregation
    outs:
      - data/graphs/voronoi_map.parquet
      - data/graphs/bs_locations.parquet
      - data/graphs/graph_edges.parquet
      - data/graphs/node_index.parquet
      - data/graphs/edge_index.npy
      - data/graphs/edge_attr.npy

  preprocess:
    cmd: python -m src.preprocess data/netmob/raw data/netmob/processed data/graphs
    deps:
      - src/preprocess.py
      - src/netmob_loader.py
      - data/netmob/raw
      - data/graphs/voronoi_map.parquet
    params:
      - params.yaml:
          - netmob
          - preprocess
    outs:
      - data/netmob/processed

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/cluster.py
      - src/coarsen.py
      - src/cluster_dataset.py
      - src/model.py
      - src/dataset.py
      - data/netmob/processed
      - data/graphs/bs_locations.parquet
      - data/graphs/node_index.parquet
      - data/graphs/edge_index.npy
      - data/graphs/edge_attr.npy
    params:
      - config.yaml:
          - data
          - clustering
          - coarsening
          - stgnn
          - training
    outs:
      - data/cluster_first
      - checkpoints/cluster_first
    metrics:
      - results/cluster_first/total/sweep_results.json:
          cache: false

  evaluate_forecast:
    cmd: python -m src.evaluate_forecast
    deps:
      - src/evaluate_forecast.py
      - src/cluster_dataset.py
      - src/model.py
      - config.yaml
      - data/cluster_first
      - checkpoints/cluster_first
      - data/graphs/bs_locations.parquet
      - data/graphs/edge_index.npy
      - data/graphs/node_index.parquet
    params:
      - config.yaml:
          - data
          - stgnn
          - training
    outs:
      - results/cluster_first/Netflix
    metrics:
      - results/cluster_first/total/forecast_eval_summary.json:
          cache: false

  # Stages the flat artifact set that UpfRLControllers / UPF_NDT consume, so the
  # handoff is a `dvc import` at a pinned rev instead of a hand-copy. Note that
  # forecast_eval_summary.json is cache:false above (so it lives in no remote);
  # the copy inside exports/ IS cached, which is what makes it fetchable
  # downstream.
  #
  # FROZEN ON PURPOSE. The bytes in exports/traffic_forecaster are the outputs of
  # the K10 checkpoint as it stood before the 2026-06-11 retrain — the arrays every
  # downstream Phase 2-9 result and the MASCOTS paper were built on. They are not
  # reproducible from the current working tree, and the live
  # results/cluster_first/total/forecast_eval_summary.json has since been
  # overwritten by a DailyMotion sweep. Unfreezing and running this stage would
  # silently replace the thesis bundle with current-model bytes. Read
  # exports/traffic_forecaster/EXPORT_MANIFEST.json ("provenance") first.
  export_for_twin:
    cmd: python scripts/export_for_twin.py --service Netflix --k 10
    frozen: true
    deps:
      - scripts/export_for_twin.py
      - results/cluster_first/Netflix
      - data/cluster_first
      - data/graphs/bs_locations.parquet
    outs:
      - exports/traffic_forecaster

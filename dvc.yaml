stages:

  build_graph:
    cmd: python -m src.aggregate
    deps:
      - src/aggregate.py
      - data/netmob/raw/Lyon/Lyon.geojson
      - data/netmob/raw/Lyon/Lyon_Sites_Cartoradio.csv
    params:
      - params.yaml:
          - grid
          - aggregation
    outs:
      - data/graphs/voronoi_map.parquet
      - data/graphs/bs_locations.parquet
      - data/graphs/graph_edges.parquet
      - data/graphs/node_index.parquet
      - data/graphs/edge_index.npy
      - data/graphs/edge_attr.npy

  preprocess:
    cmd: python -m src.preprocess data/netmob/raw data/netmob/processed data/graphs
    deps:
      - src/preprocess.py
      - src/netmob_loader.py
      - data/netmob/raw
      - data/graphs/voronoi_map.parquet
    params:
      - params.yaml:
          - netmob
          - preprocess
    outs:
      - data/netmob/processed

  train:
    cmd: python -m cluster_first.train
    deps:
      - cluster_first/train.py
      - cluster_first/cluster.py
      - cluster_first/coarsen.py
      - cluster_first/dataset.py
      - cluster_first/model.py
      - src/dataset.py
      - data/netmob/processed
      - data/graphs/bs_locations.parquet
      - data/graphs/node_index.parquet
      - data/graphs/edge_index.npy
      - data/graphs/edge_attr.npy
    params:
      - cluster_first/config.yaml:
          - data
          - clustering
          - coarsening
          - stgnn
          - training
    outs:
      - data/cluster_first
      - checkpoints/cluster_first
    metrics:
      - results/cluster_first/sweep_results.json:
          cache: false

  evaluate:
    cmd: python -m cluster_first.evaluate
    deps:
      - cluster_first/evaluate.py
      - cluster_first/config.yaml
      - data/cluster_first
      - checkpoints/cluster_first
      - data/graphs/bs_locations.parquet
    params:
      - cluster_first/config.yaml:
          - data
          - upf
    outs:
      - results/cluster_first/upf_assignments.parquet:
          cache: false
    metrics:
      - results/cluster_first/eval_metrics.json:
          cache: false

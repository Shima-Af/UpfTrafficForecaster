# ============================================================
# UPF Traffic Forecaster — Data Pipeline Parameters
# Covers: build_graph and preprocess DVC stages.
# Model / training parameters live in cluster_first/config.yaml
# ============================================================

# --- NetMob dataset ---
netmob:
  time_step_s: 900           # 15-min bins (96 slots/day)

# --- Lyon grid (NetMob 100×100 m tiles) ---
grid:
  n_cols: 287
  n_rows: 426
  tile_size_m: 100
  origin_lat: 46.062
  origin_lon: 4.637

# --- Base station (gNodeB) aggregation ---
aggregation:
  geojson_path: data/netmob/raw/Lyon/Lyon.geojson
  bs_csv: data/netmob/raw/Lyon/Lyon_Sites_Cartoradio.csv
  bs_encoding: latin-1
  bbox:
    lat_min: 45.60
    lat_max: 45.90
    lon_min: 4.70
    lon_max: 5.05
  method: voronoi
  min_tiles_per_bs: 1
  edge_method: voronoi_border
  k_neighbors: 8

# --- Preprocessing ---
preprocess:
  resample_interval: null
  cells_subset: null
  fill_missing: ffill
  min_valid_fraction: 0.80
  normalization: global_max         # single global max across ALL services

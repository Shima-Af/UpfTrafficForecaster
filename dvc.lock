      hash: md5
      md5: a277f6f2409212f608689d106cafc6cf
      size: 13063
    params:
      params.yaml:
        netmob:
          time_step_s: 900
        preprocess:
          resample_interval:
          cells_subset:
          fill_missing: ffill
          min_valid_fraction: 0.8
          normalization: global_max
          normalization_percentile: 99.9

      size: 23488
    params:
      params.yaml:
        aggregation:
          geojson_path: data/netmob/raw/Lyon/Lyon.geojson
          bs_csv: data/netmob/raw/Lyon/Lyon_Sites_Cartoradio.csv
          bs_encoding: latin-1
          bbox:
            lat_min: 45.6
            lat_max: 45.9
            lon_min: 4.7
            lon_max: 5.05
          method: voronoi
          min_tiles_per_bs: 1

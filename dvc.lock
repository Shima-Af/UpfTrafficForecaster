    params:
      config.yaml:
        clustering:
          method: skater
          n_clusters: 10
          random_state: 42
          skater:
            floor: 3
          affinity_weights:
            graph: 0.6
            density: 0.2
            shape: 0.2
          density_features:
          - mean_load
          - peak_load
          - std_load
          shape_features:
          - peak_to_mean
          - temporal_entropy
          - coeff_variation
          - night_day_ratio
        coarsening:
          edge_weight: mean_affinity
          signal_aggregation: sum
        data:
          service: Netflix
          anomaly_dates:
          - '20190512'
        stgnn:
          seq_len: 96
          horizon: 4
          hidden_dim: 64
          gat_heads: 4
          gat_layers: 2
          gru_layers: 1
          dropout: 0.2
        training:
          epochs: 150
          lr: 0.001
          scheduler: cosine
          early_stopping_patience: 15
          val_split: 0.15
          test_split: 0.15
          batch_size: 32
          seed: 42
          sweep_k:
          - 5
          - 10
          - 20
